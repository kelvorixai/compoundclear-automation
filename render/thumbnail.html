<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#05080f;
  font-family:'TeX Gyre Heros','Helvetica',sans-serif}
.card{position:relative;width:1280px;height:720px;overflow:hidden;
  background:radial-gradient(125% 95% at 20% 10%, #17325f 0%, #0d1c37 42%, #05080f 100%)}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(120,165,225,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,165,225,.06) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(95% 85% at 28% 45%, #000 38%, transparent 100%)}
.bloom{position:absolute;left:-8%;top:18%;width:820px;height:560px;
  background:radial-gradient(circle at 42% 50%, rgba(231,181,74,.22), transparent 60%);filter:blur(16px)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 190px 62px rgba(0,0,0,.74)}
.noise{position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

.wrap{position:absolute;inset:0;padding:54px 56px;display:flex;align-items:center}
.left{width:690px;position:relative;z-index:5}

.eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow i{width:36px;height:5px;background:#E7B54A;border-radius:3px;box-shadow:0 0 15px rgba(231,181,74,.8)}
.eyebrow span{font-size:20px;letter-spacing:.3em;font-weight:700;color:#9db4d6;text-transform:uppercase}

.h1{font-size:104px;line-height:.95;font-weight:700;color:#fff;letter-spacing:-3px;
  text-shadow:0 5px 0 rgba(0,0,0,.6),0 18px 40px rgba(0,0,0,.8)}
.h1 .strike{position:relative;display:inline-block;color:#cdd9ec}
.h1 .strike:after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:9px;
  background:#e0634a;border-radius:5px;transform:rotate(-2.4deg);box-shadow:0 0 20px rgba(224,99,74,.75)}
.h1 .gold{color:#ffc95c;text-shadow:0 5px 0 #8a5a10,0 9px 0 rgba(0,0,0,.5),0 20px 42px rgba(0,0,0,.8),0 0 52px rgba(231,181,74,.4)}

.sub{margin-top:26px;font-size:36px;font-weight:700;color:#9db4d6;letter-spacing:-.3px}

.mark{margin-top:34px;display:flex;align-items:center;gap:13px}
.mark svg.kmark{width:30px;height:30px;flex:none;display:block;filter:drop-shadow(0 0 14px rgba(231,181,74,.45))}
.mark span{font-size:20px;letter-spacing:.22em;font-weight:700;color:#aebfd8;text-transform:uppercase;
  text-shadow:0 2px 6px rgba(0,0,0,.9)}

.chips{position:absolute;right:52px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:15px;z-index:5}
.chip{display:flex;align-items:center;gap:18px;
  background:linear-gradient(180deg,#1b3055,#0e1d36);border:2px solid #2c4c7d;
  border-radius:15px;padding:13px 26px 13px 18px;box-shadow:0 16px 34px rgba(0,0,0,.6);width:392px}
.chip b{font-size:54px;line-height:1;color:#ffc95c;width:52px;text-align:center;flex:none;
  text-shadow:0 3px 0 #7d5310,0 0 24px rgba(231,181,74,.5)}
.chip em{font-style:normal;font-size:31px;font-weight:700;color:#fff;letter-spacing:-.3px}
.chip.hl{border-color:#E7B54A;background:linear-gradient(180deg,#2a4874,#16294a)}
</style></head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="bloom"></div>

  <div class="chips">
    <div class="chip hl"><b>R</b><em>Role</em></div>
    <div class="chip"><b>C</b><em>Context</em></div>
    <div class="chip"><b>T</b><em>Task</em></div>
    <div class="chip"><b>F</b><em>Format</em></div>
    <div class="chip"><b>X</b><em>eXamples &amp; limits</em></div>
  </div>

  <div class="wrap">
    <div class="left">
      <div class="eyebrow"><i></i><span>The prompting gap</span></div>
      <div class="h1">Stop typing<br><span class="strike">one line</span><br>into <span class="gold">AI.</span></div>
      <div class="sub">The 5-part prompt that gets<br>work you'd actually send.</div>
      <div class="mark"><svg class="kmark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7D98F"/><stop offset=".38" stop-color="#E7B54A"/><stop offset="1" stop-color="#BE8722"/></linearGradient></defs><path d="M15 12 L34 12 L34 34 L58.4 12 L85 12 L42.8 50 L85 88 L58.4 88 L34 66 L34 88 L15 88 Z" fill="url(#kg)"/></svg><span>Kelvorix Digital</span></div>
    </div>
  </div>

  <div class="vig"></div>
  <div class="noise"></div>
</div>
</body></html>
