name: Generate voice samples

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Render samples
        run: python scripts/make_voice_samples.py

      - name: Commit samples
        run: |
          git config user.name "kelvorix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add samples/*.mp3
          git diff --cached --quiet || git commit -m "Add voice samples [skip ci]"
          git pull --rebase origin main
          git push
